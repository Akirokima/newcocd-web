  :root{
    --font:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
    --bg:#07080A; --ink:#F0F0F0; --dim:#9A9A9A; --dimmer:#555555; --line:#20232A;
    --green:#5FB544; --ease:cubic-bezier(0.22,1,0.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;
       padding:0 26px 120px;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto}

  header{padding:26px 0 0;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
  .brand svg{height:44px;width:auto;display:block;color:var(--ink)}
  .lang{font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;gap:7px;align-items:center;color:var(--dimmer)}
  .lang button{font:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer;color:var(--dimmer);transition:color .2s}
  .lang button.on{color:var(--ink)}
  .lang button:hover{color:var(--dim)}

  .intro{padding:64px 0 10px}
  h1{font-size:clamp(30px,5.2vw,52px);font-weight:800;letter-spacing:-.025em;line-height:1}
  .sub{margin-top:14px;color:var(--dim);font-size:14px;max-width:52ch}
  .back{display:inline-block;margin-top:26px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--dimmer);text-decoration:none;border-bottom:1px solid transparent;transition:.2s}
  .back:hover{color:var(--ink);border-bottom-color:var(--line)}
  .warn{display:none;margin-top:22px;padding:12px 15px;border-left:2px solid var(--line);
        font-size:12.5px;color:var(--dim);line-height:1.55}
  html[lang="en"] .warn{display:block}

  .list{margin-top:52px;border-top:1px solid var(--line)}
  .post{border-bottom:1px solid var(--line)}
  .row{width:100%;background:none;border:0;padding:22px 0;cursor:pointer;text-align:left;color:inherit;
       font:inherit;display:grid;grid-template-columns:8px 128px 1fr 16px;align-items:baseline;gap:16px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dot);opacity:.5;transition:opacity .3s;
       align-self:center;transform:translateY(-1px)}
  .post.open .dot,.row:hover .dot{opacity:1}
  .date{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);
        font-variant-numeric:tabular-nums;white-space:nowrap}
  .title{font-size:clamp(15px,1.9vw,19px);font-weight:600;letter-spacing:-.01em;line-height:1.35;
         color:var(--dim);transition:color .25s}
  .row:hover .title,.post.open .title{color:var(--ink)}
  .chev{width:11px;height:11px;border-right:1.5px solid var(--dimmer);border-bottom:1.5px solid var(--dimmer);
        transform:rotate(45deg) translateY(-2px);transition:transform .35s var(--ease),border-color .25s;align-self:center}
  .post.open .chev{transform:rotate(-135deg) translateY(-2px);border-color:var(--ink)}

  .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
  .post.open .body{grid-template-rows:1fr}
  .body>.inner{overflow:hidden;opacity:0;transition:opacity .3s ease .05s}
  .post.open .body>.inner{opacity:1}
  .inner>*:first-child{margin-top:4px}
  .inner{padding-left:calc(8px + 128px + 32px);padding-right:8px}
  .inner p{font-size:15.5px;line-height:1.72;color:#c3c3ca;margin:0 0 16px;max-width:64ch}
  .inner h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
            margin:30px 0 12px}
  .inner ul,.inner ol{margin:0 0 16px 18px;max-width:64ch}
  .inner li{font-size:15.5px;line-height:1.72;color:#c3c3ca;margin-bottom:7px}
  .inner blockquote{border-left:2px solid var(--line);padding-left:16px;margin:0 0 16px;color:var(--dim);
                    font-size:14.5px;line-height:1.7;max-width:62ch}
  .inner a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.28);transition:border-color .2s}
  .inner a:hover{border-bottom-color:var(--ink)}
  .inner strong{color:var(--ink);font-weight:600}
  .inner code{font-family:var(--font-mono,ui-monospace,'SF Mono',Menlo,Consolas,monospace);
              font-size:.9em;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;color:var(--ink)}
  .inner pre{margin:0 0 16px;padding:14px 16px;border:1px solid var(--line);border-radius:6px;
             overflow-x:auto;max-width:64ch}
  .inner pre code{background:none;padding:0;font-size:13px;line-height:1.6;color:#c3c3ca}
  .src{margin-top:22px;font-size:12px;color:var(--dimmer)}
  .src a{color:var(--dimmer);border-bottom-color:rgba(255,255,255,.15)}
  .pad{padding-bottom:34px}

  footer{margin-top:70px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer)}

  @media (max-width:720px){
    body{padding:0 20px 90px}
    header{padding-top:20px} .brand svg{height:34px}
    .intro{padding-top:44px}
    .row{grid-template-columns:7px 1fr 14px;gap:12px;padding:20px 0;row-gap:6px}
    .date{grid-column:2;font-size:10px}
    .title{grid-column:2}
    .dot{grid-column:1;grid-row:1/3;align-self:center}
    .chev{grid-column:3;grid-row:1/3;align-self:center}
    .inner{padding-left:19px;padding-right:0}
    .inner p,.inner li{font-size:15px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<script>
/* Una sola entrada abierta a la vez. Sin dependencias. */
const posts=[...document.querySelectorAll('.post')];
/* Actualizar el hash nunca debe poder romper el despliegue: en visores que
   sirven la página como about:srcdoc, replaceState lanza SecurityError. */
function setHash(v){
  try{ history.replaceState(null,'', v || location.pathname + location.search); }
  catch(e){ /* entorno sin History API utilizable: se ignora */ }
}
function close(p){p.classList.remove('open');p.querySelector('.row').setAttribute('aria-expanded','false');}
function open(p){
  posts.forEach(o=>{if(o!==p) close(o);});
  p.classList.add('open');
  p.querySelector('.row').setAttribute('aria-expanded','true');
  setHash('#'+p.id);
}
posts.forEach(p=>{
  p.querySelector('.row').addEventListener('click',()=>{
    if(p.classList.contains('open')){close(p);setHash(null);}
    else{open(p);}
  });
});
/* enlace directo a una entrada */
try{
  if(location.hash){
    const p=document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if(p){open(p);setTimeout(()=>p.scrollIntoView({block:'start'}),80);}
  }
}catch(e){}
/* navegar por hash (enlace directo o botón atrás) abre la entrada */
addEventListener('hashchange',()=>{
  if(!location.hash) return;
  const p=document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if(p&&!p.classList.contains('open')) open(p);
});

/* idioma: aquí solo cambia la interfaz; las entradas siguen en español */
document.querySelectorAll('.lang button').forEach(b=>{
  b.onclick=()=>{
    const l=b.dataset.l;
    document.documentElement.lang=l;
    document.querySelectorAll('[data-es]').forEach(el=>{el.textContent=el.dataset[l];});
    document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x.dataset.l===l));
  };
});
</script>
